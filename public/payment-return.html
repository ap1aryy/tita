<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Статус оплати — TITA shop</title>
<style>body{font-family:system-ui,sans-serif;background:#fbefee;color:#3a2a2e;min-height:100vh;display:grid;place-items:center;margin:0}main{background:#fffaf9;border-radius:22px;padding:30px;max-width:420px;margin:18px;text-align:center;box-shadow:0 10px 30px #783c461c}h1{font-size:24px}p{line-height:1.6}a{color:#b25d6b}</style></head>
<body><main><h1 id="title">Перевіряємо оплату…</h1><p id="message">Будь ласка, зачекайте.</p><p><a href="/">Повернутися до TITA shop</a></p></main>
<script>
(async()=>{
 const title=document.getElementById("title"),message=document.getElementById("message");
 const id=sessionStorage.getItem("tita_invoice_id");
 if(!id){title.textContent="Не знайдено платіж";message.textContent="Поверніться до магазину та перевірте замовлення.";return;}
 try{
  const r=await fetch(`/api/payment-status?invoice_id=${encodeURIComponent(id)}`,{cache:"no-store"}),d=await r.json();
  if(!r.ok)throw new Error();
  if(d.status==="paid"){title.textContent="Оплату отримано ✓";message.textContent="Дякуємо за покупку в TITA shop!";}
  else if(d.status==="new"){title.textContent="Платіж ще очікується";message.textContent="Оновіть цю сторінку трохи пізніше.";}
  else if(d.status==="cancel"){title.textContent="Платіж скасовано";message.textContent="Інвойс скасовано. За потреби спробуйте оплатити ще раз.";}
  else if(d.status==="refund"){title.textContent="Платіж повернено";message.textContent="За цим інвойсом зафіксовано повернення коштів.";}
  else{title.textContent="Не вдалося підтвердити оплату";message.textContent=`Статус платежу: ${d.status||"невідомий"}. Зверніться до магазину.`;}
 }catch{title.textContent="Не вдалося перевірити оплату";message.textContent="Спробуйте оновити сторінку пізніше.";}
})();
</script></body></html>
